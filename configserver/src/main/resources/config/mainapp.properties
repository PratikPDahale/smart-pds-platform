spring.application.name=mainapp
server.port=8081


# Database Configuration
# Using Supabase PostgreSQL Database with SSL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pds_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
# Force localhost hostname for Eureka to avoid Windows machine name
eureka.instance.hostname=localhost
